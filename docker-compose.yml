version: "3.9"

services:
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
      - "27018:27017"   # Host port 27018 maps to container 27017
    volumes:
      - ./data/mongo:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mern-backend
    ports:
      - "9000:9000"
    env_file:
    - ./backend/.env  
    volumes:
      - ./backend:/app
    depends_on:
      - mongo
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mern-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_BACKEND_URL=http://backend:9000
    depends_on:
      - backend
    restart: always

volumes:
  mongo-data:
